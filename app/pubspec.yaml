name: talla
description: "Talla: an AI wardrobe stylist for the Arab market."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.2
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: any
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/photos/

  fonts:
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-Variable.ttf
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600

# App icons from the Talla mark: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0f6b66"
  adaptive_icon_foreground: assets/icon/foreground.png
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#f4f6f5"
    theme_color: "#0f6b66"
